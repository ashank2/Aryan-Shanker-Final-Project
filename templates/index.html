<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evora | Sustainable Transportation Assistant</title>
    <!-- In the below lines, from line 10 to line 67, CSS styles was used for the creation of the
     landing page. I wanted to beautify it slightly, therefore I used AI for help and for debugging. 
     Styles include font, background color, container layout, elements of the form and the result box
     after the user inputs their transportation details. -->
    <style>
        body {
            font-family: Arial, sans-serif;  /* Sets the font for the page. */
            background: #f4f8fb; /* Light background color. */
            margin: 0;
            padding: 0;
        } 
        .container {
        max-width: 480px; /* Reducing the size of the container (user input's box). */
        margin: 60px auto; /* Centering the container vertically. */
        background: #fff; /* White background for the form. */
        padding: 32px 24px 24px 24px; /* Adding some space inside the container amongst elements. */
        border-radius: 10px; /* Rounding the corners of the container. */
        box-shadow: 0 4px 24px rgba(44,62,80,0.10); /* A bit of shadow for design purposes. */
        }
    h1 { /* Dark Blue Heading. */
        color: #2c3e50; 
        text-align: center;
        margin-bottom: 8px;
    }
    h2 { /* Green Subheading. */
        color: #388e3c;
        text-align: center;
        font-size: 1.1em;
        margin-bottom: 24px;
    }
    label { /* Labels for the user inputs. */
        font-weight: bold; 
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
    }
    input, select { /* Creating the dropdown select menu for users to input their commute information. */
        width: 100%;
        margin-bottom: 10px;
        border: 1px solid #b0bec5; 
        border-radius: 4px;
        font-size: 1em;
    }
    button { /* Creating the "calculating emissions" button in green color. */
        width: 100%;
        padding: 10px 0;
        background: #388e3c; 
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 1.1em;
        font-weight: bold;
        margin-top: 10px;
        cursor: pointer;
    }
    .result { /* Managining the emissions result box, adding a light blue shade in the result box. */
        background: #e3f2fd;
        border-left: 4px solid #388e3c;
        margin-top: 24px;
        padding: 14px;
        border-radius: 6px;
        color: #2c3e50; 
        font-size: 1.05em;
    }
    </style>
</head>
<body>
    <!-- Landing Page Content: -->
    <div class="container">
        <h1>Welcome To Evora!</h1> <!--Main Heading-->
        <h2>Your Personal AI Sustainable Transportation Assistant</h2> <!--Subheading-->
        <!-- Form To Collect User's Inputs - Collecting Location, Distance & Mode Of Transport: -->
         <!-- AI was used for debugging purposes in line 82, line 85, line 88 to 89, lines 102 to 106. -->
        <form method="post">
            <label for="location">Starting Location</label>
            <input type="text" id="location" name="location" placeholder="e.g., Boston" required autocomplete="off">

            <label for="distance">Distance Travelled (km)</label>
            <input type="number" id="distance" name="distance" step="0.1" placeholder="e.g., 15.5" required>

            <label for="mode">Mode of Transport</label>
            <select id="mode" name="mode" required>
                <option value="" disabled selected>Select mode</option>
                <option value="car">Car</option>
                <option value="bus">Bus</option>
                <option value="train">Train</option>
                <option value="bicycle">Bicycle</option>
                <option value="walking">Walking</option>
                <option value="plane">Plane</option>
            </select>

            <button type="submit">Calculate Emissions</button>
        </form>

        <!--Display the emissions results  after the user submits he form.-->
        {% if result %}
            <div class="result">
                {{ result|safe }}
            </div>
        {% endif %}
    </div>    
</body>
</html>
